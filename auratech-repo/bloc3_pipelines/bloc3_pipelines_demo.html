<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloc 3: Pipelines Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        /* Loader spin */
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 p-8 flex items-center justify-center min-h-screen font-sans">

    <div class="bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-2xl w-full max-w-5xl">
        <div class="bg-slate-800 px-6 py-4 border-b border-slate-700 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-network-wired text-rose-400 text-xl"></i>
                <h3 class="text-lg font-bold text-white">Interactive Apache Airflow DAG</h3>
            </div>
            <div class="text-xs text-slate-400">auroratech_pipeline</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-0 border-b border-slate-700">
            <!-- DAG View -->
            <div class="p-8 bg-slate-800/30 flex flex-col items-center justify-center relative min-h-[400px]">
                <div class="absolute top-4 left-4">
                    <button id="trigger-btn" onclick="runPipeline()" class="bg-rose-600 hover:bg-rose-500 text-white font-medium py-2 px-4 rounded-lg shadow flex items-center gap-2 transition-colors cursor-pointer">
                        <i class="fa-solid fa-circle-play"></i>
                        <span id="btn-text">Trigger DAG</span>
                    </button>
                </div>

                <div class="flex flex-col items-center gap-6 mt-10 w-full" id="node-container">
                    <!-- Nodes will be injected here via JS -->
                </div>
            </div>

            <!-- Console View -->
            <div class="p-6 bg-[#0f172a] h-[450px] font-mono text-xs flex flex-col border-l border-slate-700">
                <div class="text-slate-500 mb-4 border-b border-slate-800 pb-2 flex justify-between">
                    <span>pipeline_logs.out</span>
                    <span id="live-status">IDLE</span>
                </div>
                <div class="space-y-1.5 flex-1 overflow-y-auto pb-4" id="console">
                    <div class="text-slate-600 italic" id="empty-log">No logs generated. Trigger pipeline to begin.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const nodesData = [
            { id: 'extract', label: 'Frankfurter API' },
            { id: 'simulate', label: 'Logistics Simulation' },
            { id: 'transform', label: 'Ocean-to-Air Logic' },
            { id: 'load', label: 'Postgres DW Load' }
        ];

        let running = false;
        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        function renderNodes() {
            const container = document.getElementById('node-container');
            container.innerHTML = '';
            
            nodesData.forEach((node, index) => {
                const nodeDiv = document.createElement('div');
                nodeDiv.className = 'relative flex flex-col items-center w-full';
                
                let lineHtml = '';
                if (index !== 0) {
                    lineHtml = `<div id="line-${node.id}" class="w-0.5 h-6 -mt-6 mb-2 transition-colors duration-500 bg-slate-700"></div>`;
                }

                nodeDiv.innerHTML = `
                    ${lineHtml}
                    <div id="card-${node.id}" class="flex items-center gap-4 w-64 p-3 rounded-xl border bg-slate-800 border-slate-700 transition-all duration-300">
                        <div class="shrink-0 flex items-center justify-center w-8 h-8 rounded-full bg-slate-900 border border-slate-700">
                            <i id="icon-${node.id}" class="fa-regular fa-clock text-slate-500 text-sm"></i>
                        </div>
                        <div class="flex-1">
                            <div class="text-sm font-semibold text-slate-200">${node.label}</div>
                            <div id="desc-${node.id}" class="text-xs text-slate-500 font-mono mt-0.5">queued</div>
                        </div>
                    </div>
                `;
                container.appendChild(nodeDiv);
            });
        }

        function updateNode(id, status, duration = null) {
            const card = document.getElementById(`card-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            const desc = document.getElementById(`desc-${id}`);
            const line = document.getElementById(`line-${id}`); // The line above this node

            if (status === 'running') {
                card.className = "flex items-center gap-4 w-64 p-3 rounded-xl border bg-slate-800 transition-all duration-300 border-amber-400 shadow-[0_0_15px_rgba(251,191,36,0.2)]";
                icon.className = "fa-solid fa-spinner text-amber-400 text-sm spin";
                desc.textContent = "processing...";
            } else if (status === 'success') {
                card.className = "flex items-center gap-4 w-64 p-3 rounded-xl border bg-slate-800 transition-all duration-300 border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.1)]";
                icon.className = "fa-solid fa-circle-check text-emerald-500 text-sm";
                desc.textContent = `took ${duration}`;
                if(line) {
                    line.className = "w-0.5 h-6 -mt-6 mb-2 transition-colors duration-500 bg-emerald-500";
                }
            }
        }

        function appendLog(msg) {
            const consoleDiv = document.getElementById('console');
            const emptyLog = document.getElementById('empty-log');
            if (emptyLog) emptyLog.remove();

            const timeStr = new Date().toISOString().split('T')[1].slice(0, -1);
            const p = document.createElement('div');
            p.className = 'fade-in';
            
            if (msg.includes('WARNING')) p.classList.add('text-amber-400');
            else if (msg.includes('ACTION') || msg.includes('UPDATE')) p.classList.add('text-blue-400', 'font-bold');
            else if (msg.includes('SUCCESS')) p.classList.add('text-emerald-400');
            else p.classList.add('text-slate-300');

            p.textContent = `[${timeStr}] ${msg}`;
            consoleDiv.appendChild(p);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        async function runPipeline() {
            if (running) return;
            running = true;

            const btn = document.getElementById('trigger-btn');
            btn.className = "bg-slate-700 text-white opacity-50 font-medium py-2 px-4 rounded-lg shadow flex items-center gap-2 transition-colors cursor-not-allowed";
            document.getElementById('btn-text').textContent = "Pipeline Running...";
            document.getElementById('live-status').textContent = "LIVE";
            document.getElementById('console').innerHTML = '';

            renderNodes(); // Reset visually

            appendLog("INFO: Triggering manual DAG execution...");

            // 1. Extract
            updateNode('extract', 'running');
            appendLog("Connecting to api.frankfurter.dev...");
            await wait(800);
            updateNode('extract', 'success', '0.8s');
            appendLog("SUCCESS: Fetched EUR/USD = 1.0852");

            // 2. Simulate
            updateNode('simulate', 'running');
            appendLog("Generating stochastic transit models for top vendors...");
            await wait(600);
            appendLog("WARNING: Severe weather pattern detected in Red Sea.");
            await wait(600);
            updateNode('simulate', 'success', '1.2s');
            appendLog("SUCCESS: Delays generated. Vendor VND-NV-01 delay = 12 days.");

            // 3. Transform
            updateNode('transform', 'running');
            appendLog("Applying margin threshold calculations...");
            await wait(1000);
            appendLog("ACTION: Re-routing VND-NV-01 via Air France Cargo.");
            appendLog("UPDATE: Freight cost updated from €5.00 to €45.00.");
            updateNode('transform', 'success', '1.0s');

            // 4. Load
            updateNode('load', 'running');
            appendLog("Connecting to PostgreSQL warehouse...");
            await wait(500);
            appendLog("SUCCESS: INSERT 0 3 into fact_chromebook_margin_risk completed.");
            updateNode('load', 'success', '0.5s');

            appendLog("INFO: DAG execution finished successfully.");
            
            // Reset Button
            running = false;
            btn.className = "bg-rose-600 hover:bg-rose-500 text-white font-medium py-2 px-4 rounded-lg shadow flex items-center gap-2 transition-colors cursor-pointer";
            document.getElementById('btn-text').textContent = "Trigger DAG";
            document.getElementById('live-status').textContent = "IDLE";
        }

        // Initial setup
        renderNodes();
    </script>
</body>
</html>
