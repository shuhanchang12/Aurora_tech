<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloc 4: AI Solutions Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .zoom-in { animation: zoomIn 0.3s ease-out forwards; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-gray-100 p-8 flex items-center justify-center min-h-screen font-sans">

    <div class="bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-2xl w-full max-w-5xl">
        <div class="bg-slate-800 px-6 py-4 border-b border-slate-700 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-microchip text-emerald-400 text-xl"></i>
                <h3 class="text-lg font-bold text-white">Live Model Inference</h3>
            </div>
            <div class="text-xs font-mono text-emerald-500 bg-emerald-950 px-2 py-1 rounded">POST /predict-margin-risk</div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-0">
            <!-- Inputs -->
            <div class="lg:col-span-5 p-6 border-b lg:border-b-0 lg:border-r border-slate-700 bg-slate-800/50">
                <h4 class="text-sm font-semibold text-slate-400 mb-6 uppercase tracking-wider">Input Feature Vectors</h4>
                
                <div class="space-y-6">
                    <div>
                        <div class="flex justify-between mb-2">
                            <label class="text-sm font-medium text-slate-200 block">Currency Pair (EUR/USD)</label>
                            <span class="text-emerald-400 font-mono text-sm" id="eur-val">1.080</span>
                        </div>
                        <input type="range" id="eur" min="0.95" max="1.15" step="0.01" value="1.08" class="w-full accent-emerald-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between text-xs text-slate-500 mt-1">
                            <span>Parity (Weak)</span>
                            <span>Strong</span>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between mb-2">
                            <label class="text-sm font-medium text-slate-200 block">Transit Delay (Days)</label>
                            <span class="text-emerald-400 font-mono text-sm" id="delay-val">2 Days</span>
                        </div>
                        <input type="range" id="delay" min="0" max="21" step="1" value="2" class="w-full accent-emerald-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div>
                        <label class="text-sm font-medium text-slate-200 block mb-3">Transport Mode Penalty</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button id="btn-sea" onclick="setCost(5)" class="cost-btn py-2 px-3 border rounded-lg text-sm text-center transition-all bg-slate-700 border-emerald-500 text-white">
                                Sea Freight (€5)
                            </button>
                            <button id="btn-air" onclick="setCost(45)" class="cost-btn py-2 px-3 border rounded-lg text-sm text-center transition-all border-slate-700 text-slate-400 hover:bg-slate-800 hover:text-slate-300">
                                Air Cargo (€45)
                            </button>
                        </div>
                    </div>

                    <button onclick="predict()" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg flex justify-center items-center gap-2 transition-all active:scale-[0.98]">
                        <i id="btn-icon" class="fa-solid fa-bolt"></i>
                        <span id="btn-text">Calculate Margin Risk</span>
                    </button>
                </div>
            </div>

            <!-- Output -->
            <div class="lg:col-span-7 p-6 bg-slate-900 relative flex flex-col justify-center min-h-[400px]" id="result-container">
                <!-- Initial State -->
                <div class="flex flex-col items-center justify-center text-slate-500 space-y-4 opacity-50" id="output-idle">
                    <i class="fa-solid fa-microchip text-5xl"></i>
                    <p>Awaiting model inference...</p>
                </div>
                
                <!-- Loading State (hidden initially) -->
                <div class="hidden flex-col items-center justify-center text-emerald-500 space-y-4" id="output-loading">
                    <i class="fa-solid fa-circle-notch text-5xl spin"></i>
                    <p class="pulse">Random Forest Classifier computing...</p>
                </div>

                <!-- Result State (hidden initially) -->
                <div class="hidden zoom-in w-full max-w-md mx-auto" id="output-result">
                    <div class="text-center mb-8">
                        <h4 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-2">Model Confidence</h4>
                        <div id="risk-score" class="text-6xl font-black tabular-nums tracking-tighter drop-shadow-lg">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <div id="risk-card" class="rounded-xl border p-5 mt-6">
                        <div class="flex items-start gap-3">
                            <i id="risk-icon" class="fa-solid text-xl shrink-0 mt-1"></i>
                            <div>
                                <h5 id="risk-title" class="font-bold mb-1"></h5>
                                <p id="risk-desc" class="text-slate-300 text-sm leading-relaxed"></p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        let currentCost = 5;

        // UI Event Listeners for inputs
        document.getElementById('eur').addEventListener('input', function(e) {
            document.getElementById('eur-val').textContent = parseFloat(e.target.value).toFixed(3);
        });

        document.getElementById('delay').addEventListener('input', function(e) {
            document.getElementById('delay-val').textContent = e.target.value + ' Days';
        });

        function setCost(val) {
            currentCost = val;
            const btnSea = document.getElementById('btn-sea');
            const btnAir = document.getElementById('btn-air');

            if(val === 5) {
                btnSea.className = "cost-btn py-2 px-3 border rounded-lg text-sm text-center transition-all bg-slate-700 border-emerald-500 text-white";
                btnAir.className = "cost-btn py-2 px-3 border rounded-lg text-sm text-center transition-all border-slate-700 text-slate-400 hover:bg-slate-800 hover:text-slate-300";
            } else {
                btnAir.className = "cost-btn py-2 px-3 border rounded-lg text-sm text-center transition-all bg-slate-700 border-rose-500 text-white";
                btnSea.className = "cost-btn py-2 px-3 border rounded-lg text-sm text-center transition-all border-slate-700 text-slate-400 hover:bg-slate-800 hover:text-slate-300";
            }
        }

        function predict() {
            const eurUsd = parseFloat(document.getElementById('eur').value);
            const delay = parseInt(document.getElementById('delay').value);
            
            // Toggle UI logic
            document.getElementById('btn-icon').className = "fa-solid fa-circle-notch spin";
            document.getElementById('output-idle').classList.add('hidden');
            document.getElementById('output-result').classList.add('hidden');
            document.getElementById('output-loading').classList.remove('hidden');
            document.getElementById('output-loading').classList.add('flex');

            setTimeout(() => {
                // Mock RF Algorithm
                let baseRisk = 5;
                if (eurUsd < 1.05) baseRisk += 40;
                if (eurUsd < 1.03) baseRisk += 20;
                if (currentCost >= 45) baseRisk += 35;
                if (delay > 5) baseRisk += 15;
                
                if (baseRisk > 95) baseRisk = 97 + Math.random() * 2;
                else if (baseRisk < 5) baseRisk = 2 + Math.random() * 3;

                const isHigh = baseRisk > 60;

                // Render Results
                document.getElementById('output-loading').classList.add('hidden');
                document.getElementById('output-loading').classList.remove('flex');
                document.getElementById('output-result').classList.remove('hidden');
                
                document.getElementById('btn-icon').className = "fa-solid fa-bolt";
                
                const scoreElem = document.getElementById('risk-score');
                scoreElem.textContent = baseRisk.toFixed(1) + '%';
                
                const cardElem = document.getElementById('risk-card');
                const titleElem = document.getElementById('risk-title');
                const descElem = document.getElementById('risk-desc');
                const iconElem = document.getElementById('risk-icon');

                if (isHigh) {
                    scoreElem.className = "text-6xl font-black tabular-nums tracking-tighter drop-shadow-lg text-rose-500 shadow-rose-500/20";
                    cardElem.className = "rounded-xl border p-5 mt-6 bg-rose-950/30 border-rose-900/50";
                    iconElem.className = "fa-solid fa-triangle-exclamation text-rose-500 shrink-0 mt-1";
                    titleElem.className = "font-bold mb-1 text-rose-400";
                    titleElem.textContent = "! EXECUTIVE WARNING";
                    
                    if (currentCost === 45) {
                        descElem.textContent = "High freight costs combined with current exchange rates indicate severe margin compression. Triggering Web3 automated stablecoin treasury hedging.";
                    } else {
                        descElem.textContent = "Extremely weak Euro parity detected. Standard sea shipping delays will push inventory costs into unrecoverable territory. Lock in forward contracts immediately.";
                    }
                } else {
                    scoreElem.className = "text-6xl font-black tabular-nums tracking-tighter drop-shadow-lg text-emerald-500 shadow-emerald-500/20";
                    cardElem.className = "rounded-xl border p-5 mt-6 bg-emerald-950/30 border-emerald-900/50";
                    iconElem.className = "fa-solid fa-shield-halved text-emerald-500 shrink-0 mt-1";
                    titleElem.className = "font-bold mb-1 text-emerald-400";
                    titleElem.textContent = "SYSTEM NOMINAL";
                    descElem.textContent = "Input vectors suggest stable product margins. No strategic intervention required at this time.";
                }

            }, 800);
        }
    </script>
</body>
</html>
