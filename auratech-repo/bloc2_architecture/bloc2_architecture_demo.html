<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloc 2: Architecture Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-in { animation: fadeIn 0.2s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 p-8 flex items-center justify-center min-h-screen font-sans">

    <div class="bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-2xl w-full max-w-5xl">
        <div class="bg-slate-800 px-6 py-4 border-b border-slate-700 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-server text-blue-400 text-xl"></i>
                <h3 class="text-lg font-bold text-white">Interactive Infrastructure Deployment Simulator</h3>
            </div>
            <div class="text-xs text-slate-400">Docker & PostgreSQL</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-0 relative">
            <!-- Control Panel -->
            <div class="md:col-span-4 p-6 border-b md:border-b-0 md:border-r border-slate-700 bg-slate-800/50 flex flex-col gap-4 justify-center">
                
                <button id="btn-1" onclick="runDockerCompose()" class="flex items-center justify-between px-4 py-3 rounded-xl border transition-all shadow-sm bg-blue-600 hover:bg-blue-500 border-blue-400 text-white cursor-pointer">
                    <span class="font-semibold text-sm">1. Deploy Container</span>
                    <i class="fa-solid fa-play" id="icon-1"></i>
                </button>

                <button id="btn-2" onclick="runInitSql()" disabled class="flex items-center justify-between px-4 py-3 rounded-xl border transition-all shadow-sm bg-slate-800 border-slate-700 text-slate-500 opacity-50 cursor-not-allowed">
                    <span class="font-semibold text-sm">2. Initialize Schemas</span>
                    <i class="fa-solid fa-database" id="icon-2"></i>
                </button>

                <button id="btn-3" onclick="queryData()" disabled class="flex items-center justify-between px-4 py-3 rounded-xl border transition-all shadow-sm bg-slate-800 border-slate-700 text-slate-500 opacity-50 cursor-not-allowed">
                    <span class="font-semibold text-sm">3. Query Dimension Table</span>
                    <i class="fa-solid fa-play" id="icon-3"></i>
                </button>

            </div>

            <!-- Terminal Output -->
            <div class="md:col-span-8 p-6 bg-[#0f172a] h-[400px] font-mono text-sm overflow-hidden flex flex-col relative group">
                <div class="absolute top-2 right-4 text-slate-600 text-xs">bash</div>
                <div class="flex-1 overflow-y-auto space-y-1 mt-4 pb-4" id="terminal">
                    <div class="text-slate-600" id="waiting-msg">Waiting for deployment command...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let step = 0;
        const terminal = document.getElementById('terminal');

        function appendLog(msg, type = 'normal') {
            const waitingMsg = document.getElementById('waiting-msg');
            if(waitingMsg) waitingMsg.remove();
            
            const p = document.createElement('div');
            p.className = 'fade-in';
            
            if (msg.startsWith('>')) {
                p.classList.add('text-amber-300', 'font-bold', 'mt-3');
            } else if (msg.includes('[OK]')) {
                p.classList.add('text-emerald-400');
            } else if (msg.includes('successfully')) {
                p.classList.add('text-blue-400', 'font-semibold');
            } else {
                p.classList.add('text-slate-300');
            }
            
            p.textContent = msg;
            terminal.appendChild(p);
            terminal.scrollTop = terminal.scrollHeight;
        }

        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function runDockerCompose() {
            if (step > 0) return;
            step = 1;
            
            const btn1 = document.getElementById('btn-1');
            btn1.className = "flex items-center justify-between px-4 py-3 rounded-xl border transition-all shadow-sm bg-slate-800 border-emerald-500/50 text-emerald-400 opacity-80 cursor-default";
            document.getElementById('icon-1').className = "fa-solid fa-circle-check text-emerald-500";

            appendLog('> docker-compose up -d');
            await wait(500); appendLog('Pulling postgres:15-alpine...');
            await wait(600); appendLog('Creating network auroratech_default...');
            await wait(800); appendLog('Creating auroratech_postgres_dw ... done');
            await wait(200); appendLog('Container auroratech_postgres_dw started successfully on port 5432.');

            step = 2;
            const btn2 = document.getElementById('btn-2');
            btn2.disabled = false;
            btn2.className = "flex items-center justify-between px-4 py-3 rounded-xl border transition-all shadow-sm bg-amber-600 hover:bg-amber-500 border-amber-400 text-white cursor-pointer";
            document.getElementById('icon-2').className = "fa-solid fa-play";
        }

        async function runInitSql() {
            if (step !== 2) return;
            step = 2.5;

            const btn2 = document.getElementById('btn-2');
            btn2.className = "flex items-center justify-between px-4 py-3 rounded-xl border transition-all shadow-sm bg-slate-800 border-emerald-500/50 text-emerald-400 opacity-80 cursor-default";
            document.getElementById('icon-2').className = "fa-solid fa-circle-check text-emerald-500";

            appendLog('> psql -U admin -f init.sql');
            await wait(300); appendLog('[OK] CREATE TABLE dim_date');
            await wait(200); appendLog('[OK] CREATE TABLE dim_chromebook_vendor');
            await wait(400); appendLog('[OK] CREATE TABLE fact_chromebook_margin_risk');
            await wait(200); appendLog('[OK] INSERT 0 3 (Vendor records added)');
            
            step = 3;
            const btn3 = document.getElementById('btn-3');
            btn3.disabled = false;
            btn3.className = "flex items-center justify-between px-4 py-3 rounded-xl border transition-all shadow-sm bg-emerald-600 hover:bg-emerald-500 border-emerald-400 text-white cursor-pointer";
        }

        async function queryData() {
            if (step !== 3) return;
            step = 4;
            
            const btn3 = document.getElementById('btn-3');
            btn3.className = "flex items-center justify-between px-4 py-3 rounded-xl border transition-all shadow-sm bg-slate-800 border-emerald-500/50 text-emerald-400 opacity-80 cursor-default";
            document.getElementById('icon-3').className = "fa-solid fa-circle-check text-emerald-500";

            appendLog('> SELECT vendor_id, vendor_name FROM dim_chromebook_vendor;');
            await wait(200); appendLog(' vendor_id    | vendor_name');
            await wait(50); appendLog('--------------+----------------------');
            await wait(50); appendLog(' VND-NV-01    | NVIDIA Corporation');
            await wait(50); appendLog(' VND-TSMC-02  | TSMC Foundry Services');
            await wait(50); appendLog(' VND-AUO-03   | AU Optronics Corp');
            await wait(50); appendLog('(3 rows)');
        }
    </script>
</body>
</html>
